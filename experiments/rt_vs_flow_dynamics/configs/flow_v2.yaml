experiment:
  name: rt_vs_flow_dynamics_flow_v2
  seeds: [1, 2, 3]
  output_root: results/rt_vs_flow_dynamics/flow_v2
  checkpoint_root: checkpoints/rt_vs_flow_dynamics/flow_v2
  device: cuda
  wandb: true
  wandb_project: rt-vs-flow-dynamics
  reset_loader_per_condition: true

model:
  num_layers: 4
  hidden_size: 512
  intermediate_size: 2048
  head_dim: 64
  norm_eps: 1.0e-6
  rope_theta: 10000.0
  forward_dtype: bfloat16
  codebook_seed: 20260906
  decoder_temperature: 10.0

schedule: {micro_steps: 7, outer_blocks: 16, epochs: 20}
optimizer:
  lr: 0.0001
  warmup_steps: 2000
  beta1: 0.9
  beta2: 0.95
  weight_decay: 1.0
  ema: 0.999
  fm_weight: 1.0
  ce_weight: 1.0

conditions:
  matched_rt: {kind: rt, curvature_lambda: 0.0}
  flow_v2_teacher:
    {kind: flow, version: 2, state_mode: teacher, beta: 0.0, fm_weight: 1.0, endpoint_ce_weight: 1.0, endpoint_cos_weight: 1.0}
  flow_v2_onpolicy:
    {kind: flow, version: 2, state_mode: onpolicy, beta: 0.0, fm_weight: 1.0, endpoint_ce_weight: 1.0, endpoint_cos_weight: 1.0}

toy:
  train_count: 10000
  test_count: 2000
  steps: 64
  epochs: 100
  batch_size: 256
  width: 128
  depth: 3
  lr: 0.001

sudoku:
  smoke: false
  dataset_name: ./downloaded-datasets/sudoku-extreme-1k
  eval_split: test_hard
  eval_partition: dev
  eval_dev_fraction: 0.2
  eval_partition_seed: 20260908
  repeat: 200
  augment: true
  batch_size: 96
  seed: 42
  num_workers: 1
  drop_last: true

trace:
  sample_count: 1000
  projection_dim: 32
  matched_steps: 112
  native_steps: 448
  flow_nfe: [56, 112, 224]
  fixed_window: 8
  state_eps: 0.001
  logit_eps: 0.0001
  sensitivity_state_eps: [0.01, 0.0001]
  perturb_max_puzzles: 128
  perturb_directions: 32
  perturb_sigmas: [0.001, 0.01, 0.1]
  perturb_continue_steps: 112
  jacobian_max_puzzles: 64
  jacobian_iterations: 20

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 20260906
  flow_gate:
    max_mean_gap: 0.05
    minimum_seed_exact_match: 0.50
    max_seed_range: 0.10
    accuracy_match_tolerance: 0.01
