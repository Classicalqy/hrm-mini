name: sudoku
dataset_name: ./downloaded-datasets/sudoku-extreme-full
eval_dataset_name: ./downloaded-datasets/sudoku-extreme-full

# Hard: at most 23 givens (at least 58 blank cells).
blank_min: 58
num_base_puzzles: 1000
repeat: 200
augment: True

# All models trained with this config are evaluated on the held-out test.csv
# from Sudoku-Extreme, split by the same blank-count bands.
eval_sets:
  easy:
    split: test
    eval_blank_max: 53
  medium:
    split: test
    eval_blank_min: 54
    eval_blank_max: 57
  hard:
    split: test
    eval_blank_min: 58

# A fixed held-out sample keeps the per-epoch cross-evaluation
# affordable and directly comparable across architectures and training seeds.
eval_num_base_puzzles: 10000
eval_seed: 42
