name: sudoku
dataset_name: ./downloaded-datasets/sudoku-extreme-full
eval_dataset_name: ./downloaded-datasets/sudoku-extreme-full

# tdoku backtrack-count interval. These defaults are a Medium starting point;
# inspect the downloaded train/test_hard rating histograms before a final run.
rating_min: 16
rating_max: 30
num_base_puzzles: 1000

# Preserve the original 1,000 bases x 200 repeats training budget and online
# Sudoku symmetry augmentation.
repeat: 200
augment: True

# All models trained with this config are evaluated on the held-out test.csv
# from Sudoku-Extreme, split by the same inclusive rating bands.
eval_sets:
  easy:
    split: test
    eval_rating_min: 0
    eval_rating_max: 15
  medium:
    split: test
    eval_rating_min: 16
    eval_rating_max: 30
  hard:
    split: test
    eval_rating_min: 51

# A fixed, balanced held-out sample keeps the per-epoch cross-evaluation
# affordable and directly comparable across architectures and training seeds.
eval_num_base_puzzles: 10000
eval_seed: 42
